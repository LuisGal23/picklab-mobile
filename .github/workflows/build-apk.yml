name: Build Android APK
run-name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install NPM Dependencies
        run: npm install

      - name: Build APK
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picklab-mobile
          path: picklab-mobile.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "PickLab Mobile v1.0.0 (Android APK)"
          body: |
            ### 📱 PickLab Mobile — Versión Oficial Android
            
            - **Diseño Edge-to-Edge nativo**: Soporte completo para pantalla completa por detrás de la cámara / gota de agua (notch).
            - **Splash Screen animado**: Animación del nuevo logo de telemetría deportiva PickLab.
            - **Flujo de Acceso**: Pantalla de Login y acceso libre para invitados.
            - **Arquitectura de Partidos**: Simulación Monte Carlo de 100,000 iteraciones, picks con EV positivo y auditoría inmutable.
            
            ⬇️ **Descarga directa:** Haz clic abajo en `picklab-mobile.apk` para instalarlo en tu celular Android.
          draft: false
          prerelease: false
          files: picklab-mobile.apk
